.star{fill:#7d9f91;stroke:none;animation:twinkle 4.05s ease-in-out infinite}.star:nth-child(2){animation-delay:-1.35s}.star:nth-child(3){animation-delay:-2.7s}.star:nth-child(4){animation-delay:-.7s}.star:nth-child(5){animation-delay:-2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
